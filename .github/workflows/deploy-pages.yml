name: Publicar en GitHub Pages

# Publica el tablero en https://excambiare.limaretail.com (dominio configurado en Settings > Pages;
# con Actions GitHub ignora el archivo CNAME). Compila con la URL del Web App (secret DATA_ENDPOINT) y
# cifra dist/index.html con el secret DASHBOARD_PASSWORD: sin esa clave el HTML publicado no se puede leer.
on:
  push:
    branches: [main]
  # Todos los dias despues del barrido de las 10:00 (Lima = UTC-5): la copia incrustada del tablero, que se ve
  # mientras responde el Web App, queda con los datos del dia.
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Build y cifrado
        env:
          DATA_ENDPOINT: ${{ secrets.DATA_ENDPOINT }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if [ -z "$DATA_ENDPOINT" ]; then echo "::error::Falta el secret DATA_ENDPOINT"; exit 1; fi
          # Sin clave no se publica: el tablero quedaria abierto a cualquiera con el enlace.
          if [ -z "$DASHBOARD_PASSWORD" ]; then echo "::error::Falta el secret DASHBOARD_PASSWORD"; exit 1; fi
          node scripts/build.js

      - name: Comprobar que no sale nada en claro
        run: |
          grep -q 'id="gate"' dist/index.html || { echo "::error::dist/index.html no salio cifrado"; exit 1; }
          if grep -qE 'EXCAMBIARE_(META_DATA|DATA_ENDPOINT)|script\.google\.com/macros' dist/index.html; then echo "::error::datos o endpoint en claro"; exit 1; fi
          test -f dist/robots.txt || { echo "::error::falta dist/robots.txt"; exit 1; }

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
